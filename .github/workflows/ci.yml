name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify research scripts
        run: node --test scripts/*.test.mjs

      - name: Verify
        run: ./gradlew test lint build

      - name: Build Docker image
        run: docker build --tag bybit-trader:ci .

      - name: Build dashboard Docker image
        run: docker build --file apps/dashboard/Dockerfile --tag bybit-trader-dashboard:ci apps/dashboard
