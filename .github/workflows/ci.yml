name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify research scripts
        run: node --test scripts/*.test.mjs

      - name: Verify dashboard dependencies and build
        working-directory: apps/dashboard
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Verify
        run: ./gradlew test lint build

      - name: Build Docker image
        run: docker build --tag bybit-trader:ci .

      - name: Verify runtime backup recovery
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_CONTAINER="bybit-trader-backup-source-${GITHUB_RUN_ID}"
          SOURCE_VOLUME="bybit-trader-backup-source-${GITHUB_RUN_ID}"
          SNAPSHOT_DIRECTORY="$(mktemp -d)"
          DRILL_CONTROL_CREDENTIAL="$(
            printf '%s' "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" | sha256sum | awk '{print $1}'
          )"
          CONTROL_ENV_NAME='BOT_CONTROL_TOKEN'
          export "${CONTROL_ENV_NAME}=${DRILL_CONTROL_CREDENTIAL}"
          cleanup() {
            docker rm -f "${SOURCE_CONTAINER}" >/dev/null 2>&1 || true
            docker volume rm "${SOURCE_VOLUME}" >/dev/null 2>&1 || true
            rm -rf "${SNAPSHOT_DIRECTORY}"
          }
          trap cleanup EXIT

          docker volume create "${SOURCE_VOLUME}" >/dev/null
          docker run -d \
            --name "${SOURCE_CONTAINER}" \
            --network none \
            --read-only \
            --tmpfs /tmp:exec,mode=1777 \
            -v "${SOURCE_VOLUME}:/data" \
            -e BOT_MODE=PAPER \
            -e "${CONTROL_ENV_NAME}" \
            -e BOT_PAPER_LOOP_ENABLED=false \
            -e BOT_FORWARD_MARKET_CAPTURE_ENABLED=false \
            -e BOT_MAKER_SHADOW_ENABLED=false \
            -e BOT_VOLUME_CONFIRMED_TREND_SHADOW_ENABLED=false \
            -e BOT_VOLUME_CONFIRMED_TREND_LIVE_ENABLED=false \
            -e BOT_PRIVATE_EXECUTION_ENABLED=false \
            -e BOT_PRIVATE_EXECUTION_STREAM_ENABLED=false \
            -e BOT_EXECUTION_LOOP_ENABLED=false \
            -e BOT_EXECUTION_RECONCILIATION_ENABLED=false \
            bybit-trader:ci >/dev/null

          healthy=false
          for i in $(seq 1 30); do
            if docker exec "${SOURCE_CONTAINER}" \
              curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [ "${healthy}" != "true" ]; then
            docker logs --tail=120 "${SOURCE_CONTAINER}"
            exit 1
          fi

          docker exec "${SOURCE_CONTAINER}" sh -c \
            'sqlite3 "$BOT_DATABASE_PATH" ".backup /tmp/bybit-trader-ci.sqlite"'
          docker exec "${SOURCE_CONTAINER}" test -s /tmp/bybit-trader-ci.sqlite
          docker exec "${SOURCE_CONTAINER}" cat /tmp/bybit-trader-ci.sqlite \
            > "${SNAPSHOT_DIRECTORY}/bybit-trader.sqlite"
          DATABASE_SHA256="$(sha256sum "${SNAPSHOT_DIRECTORY}/bybit-trader.sqlite" | awk '{print $1}')"
          printf '%s\n' \
            "databaseSha256=${DATABASE_SHA256}" \
            'shadowSessionId=' \
            > "${SNAPSHOT_DIRECTORY}/manifest.env"
          printf '%s  %s\n' "${DATABASE_SHA256}" 'bybit-trader.sqlite' \
            > "${SNAPSHOT_DIRECTORY}/SHA256SUMS"

          sh deploy/docker/verify-runtime-backup.sh \
            "${SNAPSHOT_DIRECTORY}" \
            bybit-trader:ci

      - name: Build dashboard Docker image
        run: docker build --file apps/dashboard/Dockerfile --tag bybit-trader-dashboard:ci apps/dashboard
