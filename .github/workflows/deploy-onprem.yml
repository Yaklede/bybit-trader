            "BOT_VOLUME_CONFIRMED_TREND_SHADOW_RECENT_SYNC_LIMIT",
            "BOT_VOLUME_CONFIRMED_TREND_SHADOW_HISTORY_PAGE_LIMIT",
            "BOT_VOLUME_CONFIRMED_TREND_SHADOW_MAX_HISTORY_REQUESTS",
            "BOT_VOLUME_CONFIRMED_TREND_SHADOW_BOUNDARY_DELAY_SECONDS",
            "BOT_VOLUME_CONFIRMED_TREND_SHADOW_RETRY_SECONDS",
            "BOT_VOLUME_CONFIRMED_TREND_LIVE_ENABLED",
            "BOT_VOLUME_CONFIRMED_TREND_APPROVAL_EXPORT_DIR",
            "BOT_VOLUME_CONFIRMED_TREND_LIVE_APPROVAL_PATH",
            "BOT_VOLUME_CONFIRMED_TREND_SHADOW_EVIDENCE_PATH",
            "BOT_VOLUME_CONFIRMED_TREND_APPROVAL_REPORT_PATH",
            "BOT_VOLUME_CONFIRMED_TREND_LIVE_RECONCILIATION_SECONDS",
            "BOT_VOLUME_CONFIRMED_TREND_LIVE_MAX_SIGNAL_AGE_SECONDS",
            "BYBIT_API_KEY",
            "BYBIT_API_SECRET",
            "BYBIT_PRIVATE_BASE_URL",
            "BYBIT_PRIVATE_WEBSOCKET_URL",
            "BYBIT_RECV_WINDOW_MILLIS",
