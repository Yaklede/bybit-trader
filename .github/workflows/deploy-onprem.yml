            "TELEGRAM_CHAT_ID",
            "DISCORD_ALERTS_ENABLED",
            "DISCORD_WEBHOOK_URL",
          ];
          const lines = keys.map((key) => `${key}=${process.env[key] || ""}`);
          fs.writeFileSync("deploy-package/env/bybit-trader.env", `${lines.join("\n")}\n`, { mode: 0o600 });
          NODE

      - name: Connect to Twingate
        if: ${{ inputs.deploy == true }}
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Prepare remote Docker directories
        if: ${{ inputs.deploy == true }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ONPREM_SSH_HOST }}
          username: ${{ secrets.ONPREM_SSH_USER }}
          key: ${{ secrets.ONPREM_SSH_PRIVATE_KEY }}
          "password": ${{ secrets.ONPREM_SSH_PASSWORD }}
          port: ${{ secrets.ONPREM_SSH_PORT }}
          fingerprint: ${{ secrets.ONPREM_SSH_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -eu
            umask 077
            STAGING_DIR='${{ secrets.ONPREM_DEPLOY_DIR }}/.deploy-staging-${{ github.run_id }}'
            rm -rf "${STAGING_DIR}"
            mkdir -p "${STAGING_DIR}" \
              '${{ secrets.ONPREM_DEPLOY_DIR }}/backups' \
              '${{ secrets.ONPREM_DEPLOY_DIR }}/images'
            chmod 700 "${STAGING_DIR}"

      - name: Upload Docker deployment package
        if: ${{ inputs.deploy == true }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ONPREM_SSH_HOST }}
          username: ${{ secrets.ONPREM_SSH_USER }}
          key: ${{ secrets.ONPREM_SSH_PRIVATE_KEY }}
          "password": ${{ secrets.ONPREM_SSH_PASSWORD }}
          port: ${{ secrets.ONPREM_SSH_PORT }}
          fingerprint: ${{ secrets.ONPREM_SSH_FINGERPRINT }}
          command_timeout: 20m
          source: "deploy-package/*"
          target: ${{ secrets.ONPREM_DEPLOY_DIR }}/.deploy-staging-${{ github.run_id }}
          strip_components: 1

      - name: Load images and restart compose services
        if: ${{ inputs.deploy == true }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ONPREM_SSH_HOST }}
          username: ${{ secrets.ONPREM_SSH_USER }}
          key: ${{ secrets.ONPREM_SSH_PRIVATE_KEY }}
          "password": ${{ secrets.ONPREM_SSH_PASSWORD }}
          port: ${{ secrets.ONPREM_SSH_PORT }}
          fingerprint: ${{ secrets.ONPREM_SSH_FINGERPRINT }}
          command_timeout: 20m
          script: |
            set -eu
            sh '${{ secrets.ONPREM_DEPLOY_DIR }}/.deploy-staging-${{ github.run_id }}/bin/activate-runtime-release.sh' \
              '${{ secrets.ONPREM_DEPLOY_DIR }}' \
              '${{ secrets.ONPREM_DEPLOY_DIR }}/.deploy-staging-${{ github.run_id }}' \
              '${{ secrets.ONPREM_DOCKER_BIND_HOST }}' \
              '${{ vars.DASHBOARD_PORT || '8080' }}' \
              '${{ github.run_id }}'

      - name: Report dry-run result
        if: ${{ inputs.deploy != true }}
        run: |
          echo "On-prem deployment dry-run passed. No Twingate connection or host change was attempted."

      - name: Notify Discord on deployment failure
        if: ${{ failure() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOY_REQUESTED: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -eu
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "Discord deployment alert skipped because the webhook is not configured."
            exit 0
          fi
          if [ "${DEPLOY_REQUESTED}" = "true" ]; then
            FAILURE_SCOPE="호스트 배포 또는 자동 롤백"
          else
            FAILURE_SCOPE="배포 사전 검증"
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          PAYLOAD="$(printf '{"content":"[주의] 온프레미스 봇 %s에 실패했어요. GitHub Actions에서 원인을 확인해 주세요: %s"}' "${FAILURE_SCOPE}" "${RUN_URL}")"
          curl -fsS --max-time 15 \
            -H 'Content-Type: application/json' \
            --data "${PAYLOAD}" \
            "${DISCORD_WEBHOOK_URL}" >/dev/null
