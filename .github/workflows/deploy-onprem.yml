name: Deploy Trend Shadow On-Prem

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "검증 후 주문 불가능한 H4 Shadow를 온프레미스 호스트에 배포"
        required: true
        type: boolean
        default: false

concurrency:
  group: onprem-runtime-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: onprem-live
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify research and deployment contracts
        run: node --test scripts/*.test.mjs

      - name: Validate on-prem connection secrets
        if: ${{ inputs.deploy == true }}
        shell: bash
        env:
          "TWINGATE_SERVICE_KEY": ${{ secrets.TWINGATE_SERVICE_KEY }}
          ONPREM_SSH_HOST: ${{ secrets.ONPREM_SSH_HOST }}
          ONPREM_SSH_USER: ${{ secrets.ONPREM_SSH_USER }}
          ONPREM_SSH_PORT: ${{ secrets.ONPREM_SSH_PORT }}
          "ONPREM_SSH_PRIVATE_KEY": ${{ secrets.ONPREM_SSH_PRIVATE_KEY }}
          "ONPREM_SSH_PASSWORD": ${{ secrets.ONPREM_SSH_PASSWORD }}
          ONPREM_SSH_FINGERPRINT: ${{ secrets.ONPREM_SSH_FINGERPRINT }}
          ONPREM_DEPLOY_DIR: ${{ secrets.ONPREM_DEPLOY_DIR }}
          ONPREM_DOCKER_BIND_HOST: ${{ secrets.ONPREM_DOCKER_BIND_HOST }}
          "BOT_CONTROL_TOKEN": ${{ secrets.BOT_CONTROL_TOKEN }}
        run: |
          set -eu
          require_secret() {
            name="$1"
            value="$2"
            if [ -z "${value}" ]; then
              printf '%s\n' "Missing required on-prem credential named ${name}." >&2
              exit 1
            fi
          }
          require_secret TWINGATE_SERVICE_KEY "${TWINGATE_SERVICE_KEY}"
          require_secret ONPREM_SSH_HOST "${ONPREM_SSH_HOST}"
          require_secret ONPREM_SSH_USER "${ONPREM_SSH_USER}"
          require_secret ONPREM_SSH_PORT "${ONPREM_SSH_PORT}"
          require_secret ONPREM_SSH_FINGERPRINT "${ONPREM_SSH_FINGERPRINT}"
          require_secret ONPREM_DEPLOY_DIR "${ONPREM_DEPLOY_DIR}"
          require_secret ONPREM_DOCKER_BIND_HOST "${ONPREM_DOCKER_BIND_HOST}"
          require_secret BOT_CONTROL_TOKEN "${BOT_CONTROL_TOKEN}"
          if [ -z "${ONPREM_SSH_PRIVATE_KEY}" ] && [ -z "${ONPREM_SSH_PASSWORD}" ]; then
            printf '%s\n' "Missing on-prem SSH private key or password." >&2
            exit 1
          fi
          case "${ONPREM_SSH_FINGERPRINT}" in
            SHA256:*) ;;
            *)
              printf '%s\n' "ONPREM_SSH_FINGERPRINT must use the SHA256: format." >&2
              exit 1
              ;;
          esac

      - name: Build Docker images
        shell: bash
        run: |
          set -eu
          APP_VERSION="$(sed -nE 's/^[[:space:]]*version = "([^"]+)".*/\1/p' build.gradle.kts | head -n 1)"
          if [ -z "${APP_VERSION}" ]; then
            APP_VERSION="0.0.0"
          fi
          SAFE_VERSION="$(printf '%s' "${APP_VERSION}" | tr -c 'A-Za-z0-9._-' '-' | sed -E 's/^-+//; s/-+$//')"
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE_TAG="${SAFE_VERSION}-${SHORT_SHA}"
          BOT_IMAGE_TAR="bybit-trader-v${SAFE_VERSION}-${SHORT_SHA}.tar.gz"
          DASHBOARD_IMAGE_TAR="bybit-trader-dashboard-v${SAFE_VERSION}-${SHORT_SHA}.tar.gz"

          docker build --tag "bybit-trader:${IMAGE_TAG}" .
          docker build --file apps/dashboard/Dockerfile --tag "bybit-trader-dashboard:${IMAGE_TAG}" apps/dashboard
          mkdir -p deploy-package/bin deploy-package/config deploy-package/images
          docker save "bybit-trader:${IMAGE_TAG}" | gzip > "deploy-package/images/${BOT_IMAGE_TAR}"
          docker save "bybit-trader-dashboard:${IMAGE_TAG}" | gzip > "deploy-package/images/${DASHBOARD_IMAGE_TAR}"
          cp compose.yaml deploy-package/compose.yaml
          cp deploy/docker/backup-runtime-state.sh deploy-package/bin/backup-runtime-state.sh
          cp deploy/docker/activate-runtime-release.sh deploy-package/bin/activate-runtime-release.sh
          cp deploy/docker/verify-runtime-backup.sh deploy-package/bin/verify-runtime-backup.sh
          cp deploy/docker/verify-runtime-profile.sh deploy-package/bin/verify-runtime-profile.sh
          cp \
            config/volume-flow-composite-current.json \
            config/volume-confirmed-trend-ensemble-v1.json \
            config/volume-confirmed-trend-ensemble-v1-bootstrap.json \
            config/volume-confirmed-trend-ensemble-v1-external-result.json \
            config/volume-confirmed-trend-ensemble-v1-kotlin-parity-result.json \
            config/volume-confirmed-trend-ensemble-v1-runtime-parity-result.json \
            config/volume-confirmed-trend-ensemble-v1-forward-policy.json \
            config/volume-confirmed-trend-live-approval.json \
            deploy-package/config/
          cat > deploy-package/release.env <<EOF
          APP_VERSION=${SAFE_VERSION}
          GIT_SHA=${GITHUB_SHA}
          SHORT_SHA=${SHORT_SHA}
          IMAGE_TAG=${IMAGE_TAG}
          BOT_IMAGE=bybit-trader:${IMAGE_TAG}
          DASHBOARD_IMAGE=bybit-trader-dashboard:${IMAGE_TAG}
          BOT_IMAGE_TAR=${BOT_IMAGE_TAR}
          DASHBOARD_IMAGE_TAR=${DASHBOARD_IMAGE_TAR}
          EOF

      - name: Build runtime env file
        env:
          # This workflow is intentionally frozen to the public-data-only H4 Shadow profile.
          # TESTNET/LIVE require a separate reviewed workflow after forward and human approval.
          BOT_MODE: PAPER
          BOT_API_HOST: ${{ vars.BOT_API_HOST || '0.0.0.0' }}
          BOT_API_PORT: ${{ vars.BOT_API_PORT || '8080' }}
          "BOT_CONTROL_TOKEN": ${{ secrets.BOT_CONTROL_TOKEN }}
          BOT_DATABASE_PATH: ${{ vars.BOT_DATABASE_PATH || '/data/bybit-trader.sqlite' }}
          BOT_SYMBOL: BTCUSDT
          BOT_TIMEFRAMES: ${{ vars.BOT_TIMEFRAMES || 'M1,M5,M15' }}
          BOT_VOLUME_FLOW_COMPOSITE_CONFIG_PATH: ${{ vars.BOT_VOLUME_FLOW_COMPOSITE_CONFIG_PATH || '/opt/bybit-trader/config/volume-flow-composite-current.json' }}
          BOT_STRATEGY_PROFILE_STATE_PATH: ${{ vars.BOT_STRATEGY_PROFILE_STATE_PATH || '/data/strategy-profile-current.txt' }}
          BOT_PAPER_LOOP_ENABLED: "false"
          BOT_PAPER_STRATEGY: ${{ vars.BOT_PAPER_STRATEGY || 'multi-horizon-momentum' }}
          BOT_PAPER_TIMEFRAME: ${{ vars.BOT_PAPER_TIMEFRAME || 'M5' }}
          BOT_PAPER_CANDLE_LIMIT: ${{ vars.BOT_PAPER_CANDLE_LIMIT || '12000' }}
          BOT_PAPER_SYNC_LIMIT: ${{ vars.BOT_PAPER_SYNC_LIMIT || '1000' }}
          BOT_PAPER_INTERVAL_SECONDS: ${{ vars.BOT_PAPER_INTERVAL_SECONDS || '300' }}
          BOT_PAPER_INITIAL_EQUITY: ${{ vars.BOT_PAPER_INITIAL_EQUITY || '1000000' }}
          BOT_PAPER_RISK_FRACTION: ${{ vars.BOT_PAPER_RISK_FRACTION || '0.01' }}
          BOT_PAPER_FEE_RATE: ${{ vars.BOT_PAPER_FEE_RATE || '0.0006' }}
          BOT_FORWARD_MARKET_CAPTURE_ENABLED: ${{ vars.BOT_FORWARD_MARKET_CAPTURE_ENABLED || 'false' }}
          BYBIT_PUBLIC_WEBSOCKET_URL: ${{ vars.BYBIT_PUBLIC_WEBSOCKET_URL }}
          BOT_FORWARD_ORDER_BOOK_DEPTH: ${{ vars.BOT_FORWARD_ORDER_BOOK_DEPTH || '50' }}
          BOT_FORWARD_RAW_ARCHIVE_ENABLED: ${{ vars.BOT_FORWARD_RAW_ARCHIVE_ENABLED || vars.BOT_FORWARD_MARKET_CAPTURE_ENABLED || 'false' }}
          BOT_FORWARD_RAW_ARCHIVE_PATH: ${{ vars.BOT_FORWARD_RAW_ARCHIVE_PATH || '/data/market-events' }}
          BOT_MAKER_SHADOW_ENABLED: "false"
          BOT_MAKER_SHADOW_SESSION_ID: ${{ vars.BOT_MAKER_SHADOW_SESSION_ID }}
          BOT_MAKER_SHADOW_INITIAL_EQUITY: ${{ vars.BOT_MAKER_SHADOW_INITIAL_EQUITY || '100' }}
          BOT_MAKER_SHADOW_ORDER_QUANTITY: ${{ vars.BOT_MAKER_SHADOW_ORDER_QUANTITY || '0.001' }}
          BOT_MAKER_SHADOW_MAX_NOTIONAL: ${{ vars.BOT_MAKER_SHADOW_MAX_NOTIONAL || '100' }}
          BOT_MAKER_SHADOW_QUEUE_MULTIPLIER: ${{ vars.BOT_MAKER_SHADOW_QUEUE_MULTIPLIER || '1.5' }}
          BOT_MAKER_SHADOW_QUEUE_BUFFER_QUANTITY: ${{ vars.BOT_MAKER_SHADOW_QUEUE_BUFFER_QUANTITY || '0' }}
          BOT_MAKER_SHADOW_MIN_SPREAD_BPS: ${{ vars.BOT_MAKER_SHADOW_MIN_SPREAD_BPS || '0' }}
          BOT_MAKER_SHADOW_MAKER_FEE_RATE: ${{ vars.BOT_MAKER_SHADOW_MAKER_FEE_RATE || '0.0002' }}
          BOT_MAKER_SHADOW_TAKER_FEE_RATE: ${{ vars.BOT_MAKER_SHADOW_TAKER_FEE_RATE || '0.00055' }}
          BOT_MAKER_SHADOW_TAKER_EXIT_SLIPPAGE_BPS: ${{ vars.BOT_MAKER_SHADOW_TAKER_EXIT_SLIPPAGE_BPS || '2' }}
          BOT_MAKER_SHADOW_MAX_QUOTE_AGE_MILLIS: ${{ vars.BOT_MAKER_SHADOW_MAX_QUOTE_AGE_MILLIS || '2000' }}
          BOT_MAKER_SHADOW_MAX_HOLDING_SECONDS: ${{ vars.BOT_MAKER_SHADOW_MAX_HOLDING_SECONDS || '60' }}
          BOT_MAKER_SHADOW_MAX_EVENT_DELAY_MILLIS: ${{ vars.BOT_MAKER_SHADOW_MAX_EVENT_DELAY_MILLIS || '1000' }}
          BOT_VOLUME_CONFIRMED_TREND_SHADOW_ENABLED: "true"
          BOT_VOLUME_CONFIRMED_TREND_PROTOCOL_PATH: /opt/bybit-trader/config/volume-confirmed-trend-ensemble-v1.json
          BOT_VOLUME_CONFIRMED_TREND_BOOTSTRAP_PATH: /opt/bybit-trader/config/volume-confirmed-trend-ensemble-v1-bootstrap.json
          BOT_VOLUME_CONFIRMED_TREND_SHADOW_INITIAL_EQUITY: "660"
          BOT_VOLUME_CONFIRMED_TREND_SHADOW_MAX_DELAY_SECONDS: "1200"
          BOT_VOLUME_CONFIRMED_TREND_SHADOW_RECENT_SYNC_LIMIT: "1000"
          BOT_VOLUME_CONFIRMED_TREND_SHADOW_HISTORY_PAGE_LIMIT: "1000"
          BOT_VOLUME_CONFIRMED_TREND_SHADOW_MAX_HISTORY_REQUESTS: "1000"
          BOT_VOLUME_CONFIRMED_TREND_SHADOW_BOUNDARY_DELAY_SECONDS: "10"
          BOT_VOLUME_CONFIRMED_TREND_SHADOW_RETRY_SECONDS: "60"
          BOT_VOLUME_CONFIRMED_TREND_LIVE_ENABLED: "false"
          BOT_VOLUME_CONFIRMED_TREND_APPROVAL_EXPORT_DIR: /data/trend-approval
          BOT_VOLUME_CONFIRMED_TREND_LIVE_APPROVAL_PATH: /opt/bybit-trader/config/volume-confirmed-trend-live-approval.json
          BOT_VOLUME_CONFIRMED_TREND_SHADOW_EVIDENCE_PATH: /data/trend-approval/pending/shadow-evidence.json
          BOT_VOLUME_CONFIRMED_TREND_APPROVAL_REPORT_PATH: /data/trend-approval/pending/approval-report.json
          BOT_VOLUME_CONFIRMED_TREND_LIVE_RECONCILIATION_SECONDS: ${{ vars.BOT_VOLUME_CONFIRMED_TREND_LIVE_RECONCILIATION_SECONDS || '15' }}
          BOT_VOLUME_CONFIRMED_TREND_LIVE_MAX_SIGNAL_AGE_SECONDS: ${{ vars.BOT_VOLUME_CONFIRMED_TREND_LIVE_MAX_SIGNAL_AGE_SECONDS || '1200' }}
          "BYBIT_API_KEY": ""
          "BYBIT_API_SECRET": ""
          BYBIT_PRIVATE_BASE_URL: ${{ vars.BYBIT_PRIVATE_BASE_URL }}
          BYBIT_PRIVATE_WEBSOCKET_URL: ${{ vars.BYBIT_PRIVATE_WEBSOCKET_URL }}
          BYBIT_RECV_WINDOW_MILLIS: ${{ vars.BYBIT_RECV_WINDOW_MILLIS || '5000' }}
          BYBIT_POSITION_IDX: "0"
          BYBIT_ACCOUNT_TYPE: UNIFIED
          BOT_PRIVATE_EXECUTION_ENABLED: "false"
          BOT_PRIVATE_EXECUTION_STREAM_ENABLED: "false"
          BOT_EXECUTION_LOOP_ENABLED: "false"
          BOT_EXECUTION_RECONCILIATION_ENABLED: "false"
          BOT_EXECUTION_RECONCILIATION_INTERVAL_SECONDS: ${{ vars.BOT_EXECUTION_RECONCILIATION_INTERVAL_SECONDS || '60' }}
          BOT_EXECUTION_ALLOW_UNVERIFIED_PROFILE: "false"
          BOT_EXECUTION_TIMEFRAME: ${{ vars.BOT_EXECUTION_TIMEFRAME || 'M5' }}
          BOT_EXECUTION_CANDLE_LIMIT: ${{ vars.BOT_EXECUTION_CANDLE_LIMIT || '18000' }}
          BOT_EXECUTION_SYNC_LIMIT: ${{ vars.BOT_EXECUTION_SYNC_LIMIT || '1000' }}
          BOT_EXECUTION_ALERT_BATCH_LIMIT: ${{ vars.BOT_EXECUTION_ALERT_BATCH_LIMIT || '100' }}
          BOT_EXECUTION_INTERVAL_SECONDS: ${{ vars.BOT_EXECUTION_INTERVAL_SECONDS || '300' }}
          BOT_EXECUTION_ACCOUNT_EQUITY: ${{ vars.BOT_EXECUTION_ACCOUNT_EQUITY || '660' }}
          BOT_EXECUTION_USE_LIVE_EQUITY: "false"
          BOT_EXECUTION_RISK_FRACTION: ${{ vars.BOT_EXECUTION_RISK_FRACTION || '0.055' }}
          BOT_EXECUTION_FEE_RATE: ${{ vars.BOT_EXECUTION_FEE_RATE || '0.0006' }}
          BOT_EXECUTION_SLIPPAGE_BUFFER_RATE: ${{ vars.BOT_EXECUTION_SLIPPAGE_BUFFER_RATE || '0.0002' }}
          BOT_EXECUTION_QTY_STEP: ${{ vars.BOT_EXECUTION_QTY_STEP || '0.001' }}
          BOT_EXECUTION_MIN_QTY: ${{ vars.BOT_EXECUTION_MIN_QTY || '0.001' }}
          BOT_EXECUTION_MAX_QTY: ${{ vars.BOT_EXECUTION_MAX_QTY }}
          BOT_EXECUTION_MAX_NOTIONAL: ${{ vars.BOT_EXECUTION_MAX_NOTIONAL || '100' }}
          BOT_EXECUTION_LEVERAGE: "1"
          BOT_EXECUTION_LIQUIDATION_BUFFER_PCT: ${{ vars.BOT_EXECUTION_LIQUIDATION_BUFFER_PCT || '0.6' }}
          BOT_EXECUTION_MIN_NET_RR: ${{ vars.BOT_EXECUTION_MIN_NET_RR || '1.0' }}
          BOT_EXECUTION_MAX_ENTRY_DELAY_SECONDS: ${{ vars.BOT_EXECUTION_MAX_ENTRY_DELAY_SECONDS || '30' }}
          BOT_EXECUTION_MAX_ACTUAL_RISK_OVERRUN_FRACTION: ${{ vars.BOT_EXECUTION_MAX_ACTUAL_RISK_OVERRUN_FRACTION || '0.05' }}
          TELEGRAM_ALERTS_ENABLED: ${{ vars.TELEGRAM_ALERTS_ENABLED || 'false' }}
          "TELEGRAM_BOT_TOKEN": ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          DISCORD_ALERTS_ENABLED: ${{ vars.DISCORD_ALERTS_ENABLED || 'false' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          mkdir -p deploy-package/env
          node <<'NODE'
          const fs = require("node:fs");
          const mode = String(process.env.BOT_MODE || "PAPER").toUpperCase();
          process.env.BOT_MODE = mode;

          const isEnabled = (key) => String(process.env[key] || "").trim().toLowerCase() === "true";
          const executionLoopEnabled = isEnabled("BOT_EXECUTION_LOOP_ENABLED");
          const trendShadowEnabled = isEnabled("BOT_VOLUME_CONFIRMED_TREND_SHADOW_ENABLED");
          const trendLiveEnabled = isEnabled("BOT_VOLUME_CONFIRMED_TREND_LIVE_ENABLED");

          if (executionLoopEnabled) {
            const policy = JSON.parse(
              fs.readFileSync("config/volume-confirmed-trend-ensemble-v1-forward-policy.json", "utf8"),
            );
            if (policy.decision?.liveExecutionAllowed !== true) {
              console.error(
                "Automatic execution is blocked: the frozen forward policy has not approved live execution.",
              );
              process.exit(1);
            }
          }

          if (mode === "PAPER") {
            const incompatiblePrivateSettings = [
              "BOT_PRIVATE_EXECUTION_ENABLED",
              "BOT_PRIVATE_EXECUTION_STREAM_ENABLED",
              "BOT_EXECUTION_LOOP_ENABLED",
              "BOT_EXECUTION_RECONCILIATION_ENABLED",
              "BOT_VOLUME_CONFIRMED_TREND_LIVE_ENABLED",
            ].filter(isEnabled);
            if (incompatiblePrivateSettings.length > 0) {
              console.error(
                `PAPER mode cannot enable private execution: ${incompatiblePrivateSettings.join(", ")}`,
              );
              process.exit(1);
            }
            process.env.BYBIT_API_KEY = "";
            process.env.BYBIT_API_SECRET = "";
          }

          if (trendShadowEnabled && !trendLiveEnabled) {
            const incompatibleShadowSettings = [
              ...(mode === "PAPER" ? [] : ["BOT_MODE"]),
              "BOT_PAPER_LOOP_ENABLED",
              "BOT_MAKER_SHADOW_ENABLED",
              "BOT_PRIVATE_EXECUTION_ENABLED",
              "BOT_PRIVATE_EXECUTION_STREAM_ENABLED",
              "BOT_EXECUTION_LOOP_ENABLED",
              "BOT_EXECUTION_RECONCILIATION_ENABLED",
            ].filter((key) => key === "BOT_MODE" || isEnabled(key));
            if (incompatibleShadowSettings.length > 0) {
              console.error(
                `Trend Shadow requires an isolated PAPER runtime: ${incompatibleShadowSettings.join(", ")}`,
              );
              process.exit(1);
            }
          }

          if (trendLiveEnabled) {
            if (mode !== "TESTNET" && mode !== "LIVE") {
              console.error("Trend live execution requires BOT_MODE=TESTNET or LIVE.");
              process.exit(1);
            }
            if (!trendShadowEnabled) {
              console.error(
                "Trend live execution requires BOT_VOLUME_CONFIRMED_TREND_SHADOW_ENABLED=true.",
              );
              process.exit(1);
            }
            const incompatibleTrendLiveSettings = [
              "BOT_PAPER_LOOP_ENABLED",
              "BOT_MAKER_SHADOW_ENABLED",
              "BOT_PRIVATE_EXECUTION_ENABLED",
              "BOT_PRIVATE_EXECUTION_STREAM_ENABLED",
              "BOT_EXECUTION_LOOP_ENABLED",
              "BOT_EXECUTION_RECONCILIATION_ENABLED",
            ].filter(isEnabled);
            if (incompatibleTrendLiveSettings.length > 0) {
              console.error(
                `Trend live execution must be isolated from other trading loops: ${incompatibleTrendLiveSettings.join(", ")}`,
              );
              process.exit(1);
            }
            if (String(process.env.BYBIT_POSITION_IDX || "0").trim() !== "0") {
              console.error("Trend live execution requires BYBIT_POSITION_IDX=0.");
              process.exit(1);
            }
            if (String(process.env.BYBIT_ACCOUNT_TYPE || "UNIFIED").trim().toUpperCase() !== "UNIFIED") {
              console.error("Trend live execution requires BYBIT_ACCOUNT_TYPE=UNIFIED.");
              process.exit(1);
            }
            const approvalPath = String(process.env.BOT_VOLUME_CONFIRMED_TREND_LIVE_APPROVAL_PATH || "").trim();
            const packagedApprovalPath = "/opt/bybit-trader/config/volume-confirmed-trend-live-approval.json";
            if (approvalPath !== packagedApprovalPath) {
              console.error(
                `Trend live execution requires the packaged approval receipt path: ${packagedApprovalPath}.`,
              );
              process.exit(1);
            }
            const evidencePath = String(process.env.BOT_VOLUME_CONFIRMED_TREND_SHADOW_EVIDENCE_PATH || "").trim();
            const reportPath = String(process.env.BOT_VOLUME_CONFIRMED_TREND_APPROVAL_REPORT_PATH || "").trim();
            if (!evidencePath || !reportPath || evidencePath.includes("/pending/") || reportPath.includes("/pending/")) {
              console.error(
                "Trend live execution requires explicit frozen Shadow evidence and approval report paths.",
              );
              process.exit(1);
            }
            const receipt = JSON.parse(
              fs.readFileSync("config/volume-confirmed-trend-live-approval.json", "utf8"),
            );
            const isSha256 = (value) => /^[0-9a-f]{64}$/.test(String(value || ""));
            const receiptIsComplete =
              receipt.status === "APPROVED" &&
              receipt.liveExecutionAllowed === true &&
              String(receipt.approvalId || "").trim().length > 0 &&
              String(receipt.shadowSessionId || "").trim().length > 0 &&
              String(receipt.approvedAt || "").trim().length > 0 &&
              String(receipt.approvedBy || "").trim().length > 0 &&
              isSha256(receipt.protocol?.sha256) &&
              isSha256(receipt.forwardPolicy?.sha256) &&
              isSha256(receipt.shadowEvidenceSha256) &&
              isSha256(receipt.approvalReportSha256);
            if (!receiptIsComplete) {
              console.error(
                "Trend live execution is blocked: the packaged human approval receipt is incomplete or not approved.",
              );
              process.exit(1);
            }
          }

          const required = [
            "BOT_CONTROL_TOKEN",
            ...(mode === "PAPER" ? [] : ["BYBIT_API_KEY", "BYBIT_API_SECRET"]),
          ];
          const missing = required.filter((key) => !String(process.env[key] || "").trim());
          if (missing.length > 0) {
            console.error(`Missing required runtime environment values: ${missing.join(", ")}`);
            process.exit(1);
          }
          if (!String(process.env.BYBIT_PRIVATE_BASE_URL || "").trim()) {
            process.env.BYBIT_PRIVATE_BASE_URL =
              mode === "TESTNET" ? "https://api-testnet.bybit.com" : "https://api.bybit.com";
          }
          if (!String(process.env.BYBIT_PRIVATE_WEBSOCKET_URL || "").trim()) {
            process.env.BYBIT_PRIVATE_WEBSOCKET_URL =
              mode === "TESTNET"
                ? "wss://stream-testnet.bybit.com/v5/private"
                : "wss://stream.bybit.com/v5/private";
          }
          const keys = [
            "BOT_MODE",
            "BOT_API_HOST",
            "BOT_API_PORT",
            "BOT_CONTROL_TOKEN",
            "BOT_DATABASE_PATH",
            "BOT_SYMBOL",
            "BOT_TIMEFRAMES",
            "BOT_VOLUME_FLOW_COMPOSITE_CONFIG_PATH",
            "BOT_STRATEGY_PROFILE_STATE_PATH",
            "BOT_PAPER_LOOP_ENABLED",
            "BOT_PAPER_STRATEGY",
            "BOT_PAPER_TIMEFRAME",
            "BOT_PAPER_CANDLE_LIMIT",
            "BOT_PAPER_SYNC_LIMIT",
            "BOT_PAPER_INTERVAL_SECONDS",
            "BOT_PAPER_INITIAL_EQUITY",
            "BOT_PAPER_RISK_FRACTION",
            "BOT_PAPER_FEE_RATE",
            "BOT_FORWARD_MARKET_CAPTURE_ENABLED",
            "BYBIT_PUBLIC_WEBSOCKET_URL",
            "BOT_FORWARD_ORDER_BOOK_DEPTH",
            "BOT_FORWARD_RAW_ARCHIVE_ENABLED",
            "BOT_FORWARD_RAW_ARCHIVE_PATH",
            "BOT_MAKER_SHADOW_ENABLED",
            "BOT_MAKER_SHADOW_SESSION_ID",
            "BOT_MAKER_SHADOW_INITIAL_EQUITY",
            "BOT_MAKER_SHADOW_ORDER_QUANTITY",
            "BOT_MAKER_SHADOW_MAX_NOTIONAL",
            "BOT_MAKER_SHADOW_QUEUE_MULTIPLIER",
            "BOT_MAKER_SHADOW_QUEUE_BUFFER_QUANTITY",
            "BOT_MAKER_SHADOW_MIN_SPREAD_BPS",
            "BOT_MAKER_SHADOW_MAKER_FEE_RATE",
            "BOT_MAKER_SHADOW_TAKER_FEE_RATE",
            "BOT_MAKER_SHADOW_TAKER_EXIT_SLIPPAGE_BPS",
            "BOT_MAKER_SHADOW_MAX_QUOTE_AGE_MILLIS",
            "BOT_MAKER_SHADOW_MAX_HOLDING_SECONDS",
            "BOT_MAKER_SHADOW_MAX_EVENT_DELAY_MILLIS",
            "BOT_VOLUME_CONFIRMED_TREND_SHADOW_ENABLED",
            "BOT_VOLUME_CONFIRMED_TREND_PROTOCOL_PATH",
